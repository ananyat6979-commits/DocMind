name: postgres
on:
  push:
    branches: [main, improvements/hindi-evidence]
    paths: ["docmind/**", "scripts/migrate_postgres.py", "tests/test_postgres_backend.py", "locks/postgres.txt", ".github/workflows/postgres.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_PASSWORD: integration-admin-only
          POSTGRES_DB: docmind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d docmind"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOCMIND_TEST_MODE: "1"
      DOCMIND_MIGRATION_DSN: postgresql://postgres:integration-admin-only@localhost:5432/docmind
      DOCMIND_DB_PASSWORD: integration-runtime-only-credentials
      DOCMIND_TEST_POSTGRES_URL: postgresql://docmind_runtime:integration-runtime-only-credentials@localhost:5432/docmind
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Install offline test dependencies and locked database driver
        run: |
          pip install numpy faiss-cpu pypdfium2 python-docx fastapi uvicorn httpx python-multipart python-dotenv tqdm pytest regex lingua-language-detector==2.1.1
          pip install --require-hashes -r locks/postgres.txt
      - name: Provision separate runtime role and forced tenant policies
        run: python scripts/migrate_postgres.py --tenant alpha --tenant beta
      - name: Exercise live isolation, persistent search, shared quotas and lease recovery
        run: python -m pytest tests/test_postgres_backend.py -v

      - name: Validate private deployment initialization and Compose wiring
        run: |
          python -m pytest tests/test_production_init.py -q
          python scripts/init_production.py --directory .secrets/ci --tenant alpha --tenant beta
          docker compose --env-file .secrets/ci/compose.env -f compose.postgres.yml config --quiet

      - name: Verify a consistent dump restored into a fresh database
        run: |
          mkdir -p .secrets/restore
          python scripts/check_postgres_restore.py --manifest .secrets/restore/probe.json --seed
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -Fc docmind > .secrets/restore/database.dump
          docker exec ${{ job.services.postgres.id }} createdb -U postgres docmind_restored
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U postgres -d docmind_restored < .secrets/restore/database.dump
          DOCMIND_TEST_POSTGRES_URL=postgresql://docmind_runtime:integration-runtime-only-credentials@localhost:5432/docmind_restored python scripts/check_postgres_restore.py --manifest .secrets/restore/probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: database-restore-check
          include-hidden-files: true
          path: .secrets/restore/restore-summary.json
