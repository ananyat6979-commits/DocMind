name: Static evidence showcase
on:
  workflow_dispatch:
  push:
    branches: [main, improvements/hindi-evidence]
    paths: ["showcase/**", "assets/demo/**", "scripts/build_showcase.py", "scripts/check_showcase.py", ".github/workflows/pages.yml"]
permissions:
  contents: read
concurrency:
  group: evidence-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Build from public artifacts only
        run: python scripts/build_showcase.py
      - name: Install browser test dependency
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Verify replay, missing rows and responsive layout
        run: python scripts/check_showcase.py
      - name: Retain actual browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-showcase-checks
          path: reports/release_workspace/showcase-check/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.ref == 'refs/heads/main'
        with: {path: .site-dist}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static recorded evidence
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
