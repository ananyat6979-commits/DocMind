name: docker
# Builds the image on GitHub's machines (no local Docker needed), smoke-tests it, and
# publishes it to GitHub Container Registry (ghcr.io). Run manually from the Actions tab at any time.
on:
  push:
    branches: [main, improvements/hindi-evidence]
    paths: ["Dockerfile", "locks/**", "requirements.txt", "docmind/**", "app.py", "scripts/**", ".streamlit/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase image name (registry requires it)
        id: image
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docmind" >> "$GITHUB_ENV"
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docmind" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (loaded locally for smoke tests)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke 1, both models load with the network disabled (proves they are baked in)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=256m --tmpfs /data:rw,uid=10001,gid=10001,size=128m ${{ env.IMAGE }}:ci python -c "
          import os
          assert not os.access('/app/docmind', os.W_OK), 'application source must be read-only to runtime UID'
          assert not os.access('/opt/hf', os.W_OK), 'baked model cache must be read-only to runtime UID'
          from docmind.embeddings import embed_query
          from docmind.retrieval.reranker import _get_model
          print('embedding shape', embed_query('hello').shape)
          _get_model(); print('reranker loaded')
          from docmind.attribution import NLIJudge
          NLIJudge(); print('attribution model loaded')"

      - name: Smoke 2, real default retrieval and attribution with an offline demo reader
        run: |
          docker run --rm --network none -e DOCMIND_TEST_MODE=0 -e DOCMIND_HOME=/tmp/dm ${{ env.IMAGE }}:ci python -c "
          import pathlib, math
          from docmind.ingestion.pipeline import ingest
          from docmind.agent.react import ReActAgent
          from docmind.llm.demo import DemoLLM
          from docmind.config import CONFIG
          assert CONFIG.embedding.model_name == 'intfloat/multilingual-e5-small'
          assert CONFIG.retriever.mode == 'dense'
          pathlib.Path('/tmp/a.txt').write_text('Coolant must stay below 300 degrees during startup. Operators verify the pump every shift. ' * 4)
          ingest('/tmp/a.txt')
          r = ReActAgent(llm=DemoLLM()).run('coolant limit during startup')
          assert '300' in r.answer and '(Source:' in r.answer, 'missing supported source answer'
          assert r.sources and all(source.retriever == 'dense' for source in r.sources)
          attribution = r.citation_report['attribution']
          assert attribution and not attribution.get('error') and attribution['n_claims'] > 0
          assert math.isfinite(attribution['supported_fraction'])
          print('real E5 default, citations and NLI completed with network disabled')"

      - name: Measure bounded real-model loopback HTTP paths with offline demo generation
        timeout-minutes: 10
        run: |
          mkdir -p reports/release_workspace/http-load
          chmod 777 reports/release_workspace/http-load
          docker run --rm --network none -v "$PWD/reports/release_workspace/http-load:/results" \
            ${{ env.IMAGE }}:ci python scripts/load_http_service.py --out /results/real-model-http \
            --real-models --requests 12 --concurrency 2 --deadline 420

      - name: Keep numeric HTTP load records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-model-http-load
          path: |
            reports/release_workspace/http-load/real-model-http/summary.json
            reports/release_workspace/http-load/real-model-http/rows.jsonl

      - name: Smoke 3, the UI starts and reports healthy
        run: |
          docker run -d --name dm -p 8501:8501 ${{ env.IMAGE }}:ci
          for i in $(seq 1 40); do curl -fs http://localhost:8501/_stcore/health && break; sleep 3; done
          curl -fs http://localhost:8501/_stcore/health | grep -q ok || { docker logs dm; exit 1; }
          docker logs dm | tail -n 15

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  attest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Attest the published image digest
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
