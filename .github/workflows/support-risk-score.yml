name: Score public support-risk inputs
on:
  workflow_call:
    inputs:
      model-index:
        required: true
        type: number
    outputs:
      payload:
        value: ${{ jobs.score.outputs.payload }}
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    outputs:
      payload: ${{ steps.evaluate.outputs.payload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Install locked CPU evaluation dependencies
        run: |
          python -m pip install --require-hashes -r locks/cpu-linux-py311.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes -r locks/support-evaluation-linux-py311.txt
      - name: Score the frozen public human-label cohort
        id: evaluate
        timeout-minutes: 65
        env:
          CUDA_VISIBLE_DEVICES: ""
          TOKENIZERS_PARALLELISM: "false"
          HF_HOME: ${{ runner.temp }}/support-models
          PYTHONUTF8: "1"
        run: |
          python scripts/support_risk_component.py score --model-index ${{ inputs.model-index }} \
            --cache "${{ runner.temp }}/support-source" \
            --out reports/release_workspace/support-risk/model-${{ inputs.model-index }}
