name: Offline workflow capture
on:
  workflow_dispatch:
  push:
    branches: [improvements/hindi-evidence]
    paths: ["scripts/capture_core_demo.py", ".github/workflows/demo.yml"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: docmind:capture
          cache-from: type=gha
      - name: Prepare free headless capture dependencies
        run: |
          pip install playwright==1.65.2 pillow==13.0.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Capture isolated synthetic workflow
        run: |
          mkdir -p reports/release_workspace/demo-capture
          chmod 777 reports/release_workspace/demo-capture
          docker run -d --name docmind-demo --network host -v "$PWD/reports/release_workspace/demo-capture:/capture" docmind:capture python scripts/capture_core_demo.py --serve-only --out /capture
          python scripts/capture_core_demo.py --out reports/release_workspace/demo-capture
      - name: Retain only reviewed-capture candidates and numeric provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: offline-workflow-capture
          path: |
            reports/release_workspace/demo-capture/ui-*.png
            reports/release_workspace/demo-capture/captions.json
            reports/release_workspace/demo-capture/frame-*.png
            reports/release_workspace/demo-capture/docmind-workflow.gif
            reports/release_workspace/demo-capture/manifest.json
            reports/release_workspace/demo-capture/capture-failure.*
          if-no-files-found: warn
      - name: Stop isolated demo
        if: always()
        run: docker stop docmind-demo || true
