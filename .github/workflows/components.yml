name: CPU component measurements
on:
  workflow_dispatch:
  push:
    branches: [improvements/hindi-evidence]
    paths: ["scripts/release_components_cpu.py", "scripts/miracl_component.py", "scripts/prepare_miracl_component.py", "scripts/release_measure.py", "locks/cpu-linux-py311.txt", ".github/workflows/components.yml"]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Install hash-locked CPU environment
        run: pip install --require-hashes -r locks/cpu-linux-py311.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Measure public NLI components and real-embedding ANN
        run: python scripts/release_components_cpu.py
      - name: Keep aggregate results without restricted text or annotation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-component-summary
          path: |
            reports/release_workspace/cpu-components/summary.json
            reports/release_workspace/cpu-components/nli-predictions.json
            reports/release_workspace/cpu-components/ann-query-records.json
          if-no-files-found: warn
  retrieval:
    # Full corpus preparation is a deliberate frozen release experiment.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.11"}
      - name: Install hash-locked CPU environment
        run: pip install --require-hashes -r locks/cpu-linux-py311.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Prepare frozen public candidate pools without committing source text
        run: python scripts/prepare_miracl_component.py --out reports/release_workspace/miracl --queries 200 --distractors 2000
      - name: Measure paired retrieval and lexical ablations
        run: python scripts/miracl_component.py --inputs reports/release_workspace/miracl --out reports/release_workspace/miracl-cpu --device cpu --distractors 2000 --max-seconds 5400
      - name: Keep numeric retrieval results without source text
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: miracl-component-summary
          path: |
            reports/release_workspace/miracl-cpu/summary.json
            reports/release_workspace/miracl-cpu/manifest.json
            reports/release_workspace/miracl-cpu/records.jsonl
          if-no-files-found: warn
