name: Public support-risk component
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    uses: ./.github/workflows/support-risk-score.yml
    with: {model-index: 0}
  comparison:
    uses: ./.github/workflows/support-risk-score.yml
    with: {model-index: 1}
  summarize:
    if: always()
    needs: [legacy, comparison]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Install locked plot dependencies
        run: python -m pip install --require-hashes -r locks/support-evaluation-linux-py311.txt
      - name: Restore legacy numeric checkpoint
        env:
          SUPPORT_PAYLOAD: ${{ needs.legacy.outputs.payload }}
        run: python scripts/support_risk_component.py unpack --out reports/release_workspace/support-risk/model-0
      - name: Restore comparison numeric checkpoint
        env:
          SUPPORT_PAYLOAD: ${{ needs.comparison.outputs.payload }}
        run: python scripts/support_risk_component.py unpack --out reports/release_workspace/support-risk/model-1
      - name: Select using calibration only and report held-out curves
        run: |
          python scripts/support_risk_component.py summarize \
            --inputs reports/release_workspace/support-risk/model-0 reports/release_workspace/support-risk/model-1 \
            --out reports/release_workspace/support-risk/final
