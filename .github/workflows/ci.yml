name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install (offline test deps only, no model downloads)
        run: |
          pip install numpy faiss-cpu pypdfium2 python-docx fastapi httpx python-multipart \
                      streamlit python-dotenv tqdm pytest pyyaml ruff mypy regex lingua-language-detector==2.1.1
      - name: Syntax and undefined-name checks
        run: ruff check docmind scripts tests
      - name: Strong lint for repaired runtime paths
        run: |
          ruff check --select F,B,I,E701,E702 docmind/claim_checks.py docmind/evidence.py \
            docmind/language.py docmind/review/release.py docmind/ingestion/loader.py \
            docmind/ingestion/pipeline.py docmind/api/main.py
      - name: Type checks
        run: python -m mypy docmind app.py --ignore-missing-imports --check-untyped-defs
      - name: Tests (hash embedder, lexical reranker, demo LLM)
        run: python -m pytest -q
      - name: Verify published benchmark records
        run: python scripts/verify_benchmark_reports.py

      - name: Verify current-reader synthetic robustness records
        run: python scripts/verify_current_reader_robustness.py reports/releases/r2/current_reader_t4

      - name: Verify frozen selective-risk records
        run: python scripts/verify_calibration_closure.py reports/releases/r3/calibration

      - name: Verify broader synthetic robustness records
        run: python scripts/verify_robustness_closure.py reports/releases/r3/robustness

      - name: Verify published infrastructure records
        run: python scripts/verify_infrastructure_profiles.py reports/releases/r3/infrastructure

      - name: Verify persistent ANN scale records
        run: python scripts/verify_scale_profile.py reports/releases/r3/scale

      - name: Verify frozen local-reader paired control
        run: python scripts/verify_paired_core_profile.py reports/releases/r4/paired_core_t4

      - name: Verify quoted-policy synthetic records
        run: python scripts/verify_quoted_policy_robustness.py reports/releases/r4/quoted_policy_t4

      - name: Verify bounded complete-schema confirmation
        run: python scripts/verify_quoted_policy_robustness.py reports/releases/r4/quoted_complete_schema_t4

      - name: Verify own-document numeric records
        run: python scripts/verify_own_document_profile.py reports/releases/r4/own_document_t4
