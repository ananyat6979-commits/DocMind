services:
  parser:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.parser
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./parser-seccomp.json
    mem_limit: 768m
    cpus: 1
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=700
    volumes:
      - parser-socket:/run/docmind-parser
    restart: on-failure:3
volumes:
  parser-socket:
