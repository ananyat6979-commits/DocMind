# The UI has no library volume or generation credentials. All operations go through the API.
services:
  ui:
    build: .
    image: docmind:local
    ports: ["127.0.0.1:8501:8501"]
    environment:
      DOCMIND_API_URL: http://api:8000
      DOCMIND_HOME: /tmp/docmind
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
  api:
    build: .
    image: docmind:local
    group_add: ["${DOCMIND_CREDENTIALS_GID:-1000}"]
    command: ["python", "-m", "docmind.api.server", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DOCMIND_LLM_MODEL: ${DOCMIND_LLM_MODEL:-}
      DOCMIND_MAX_TOKENS: ${DOCMIND_MAX_TOKENS:-2048}
      DOCMIND_RETRIEVAL_MODE: ${DOCMIND_RETRIEVAL_MODE:-dense}
      DOCMIND_EMBEDDING_MODEL: ${DOCMIND_EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      DOCMIND_EMBEDDING_REVISION: ${DOCMIND_EMBEDDING_REVISION:-}
      DOCMIND_USE_RERANKER: ${DOCMIND_USE_RERANKER:-1}
      DOCMIND_RERANKER_MODEL: ${DOCMIND_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      DOCMIND_RERANKER_REVISION: ${DOCMIND_RERANKER_REVISION:-}
      DOCMIND_MIN_RERANK_SCORE: ${DOCMIND_MIN_RERANK_SCORE:-}
      DOCMIND_REVIEW_MIN_SCORE: ${DOCMIND_REVIEW_MIN_SCORE:-}
      DOCMIND_CREDENTIALS_FILE: /run/secrets/credentials.json
      DOCMIND_PARSER_MODE: service
      DOCMIND_PARSER_SOCKET: /run/docmind-parser/parser.sock
    volumes:
      - docmind-api-data:/data
      - parser-socket:/run/docmind-parser:ro
      - type: bind
        source: ${DOCMIND_CREDENTIALS_PATH:?Set the private credentials.json path}
        target: /run/secrets/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on: [parser]
    restart: unless-stopped
  parser:
    build:
      context: .
      dockerfile: deployment/Dockerfile.parser
    network_mode: none
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:deployment/parser-seccomp.json
    mem_limit: 768m
    cpus: 1
    pids_limit: 32
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=700
    volumes:
      - parser-socket:/run/docmind-parser
    restart: on-failure:3
volumes:
  docmind-api-data:
  parser-socket:
